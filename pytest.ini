[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --alluredir=reports/allure-results
    --html=reports/html/report.html
    --self-contained-html
    --reruns=1
    --reruns-delay=2

markers =
    smoke: Fast sanity checks — run on every deployment
    regression: Full feature coverage — run nightly or on PRs
    e2e: Multi-page user journeys — run on release candidates
    auth: Authentication and account tests
    search: Site search and cruise search tests
    accessibility: Accessibility and SEO basics
    slow: Tests that take >30s
    booking: Booking flow tests (cabin selection through payment)
    market_us: US market (princess.com)
    market_uk: UK market (princess.com/en-uk)
    market_au: AU market (princess.com/en-au)
